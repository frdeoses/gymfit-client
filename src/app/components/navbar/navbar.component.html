<mat-toolbar class="toolbar">
  <button
    mat-icon-button
    class="toolbar-icon"
    (click)="toggleSidebar()"
    *ngIf="isSmallScreen && isLogin"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <a [routerLink]="'/'" mat-icon-button class="toolbar-icon">
    <mat-icon>sports_gymnastics</mat-icon>
  </a>

  <span>GYMFIT!!</span>
  <span class="toolbar-spacer"></span>

  <a
    class="auth-link"
    *ngIf="!isLogin && !isSmallScreen"
    [routerLink]="'/login'"
    mat-icon-button
  >
    Iniciar sesión
  </a>

  <button
    *ngIf="!isLogin && isSmallScreen"
    mat-icon-button
    class="auth-link favorite-icon"
    routerLink="/admin/profile"
  >
    <mat-icon>supervised_user_circle</mat-icon>
  </button>

  <a
    class="auth-link"
    *ngIf="!isLogin && !isSmallScreen"
    [routerLink]="'/register'"
    mat-icon-button
  >
    Registrarse
  </a>

  <button
    *ngIf="!isLogin && isSmallScreen"
    mat-icon-button
    class="auth-link favorite-icon"
    routerLink="/admin/profile"
  >
    <mat-icon>person_add</mat-icon>
  </button>

  <button
    *ngIf="isLogin && role === 'ADMIN'"
    mat-button
    mat-icon-button
    [matBadge]="newNotificationsCount"
    [matBadgeHidden]="newNotificationsCount === 0"
    matBadgeColor="warn"
    class="mr20"
    routerLink="/admin/notification"
  >
    <mat-icon mat-list-icon>notifications</mat-icon>
  </button>

  <button
    *ngIf="isLogin && role === 'USER'"
    mat-button
    mat-icon-button
    [matBadge]="newNotificationsCount"
    [matBadgeHidden]="newNotificationsCount === 0"
    matBadgeColor="warn"
    class="mr20"
    routerLink="/user-dashboard/notification"
  >
    <mat-icon mat-list-icon>notifications</mat-icon>
  </button>

  <button
    *ngIf="isLogin && role === 'ADMIN' && !isSmallScreen"
    mat-button
    mat-icon-button
    class="auth-link"
    routerLink="/admin/profile"
  >
    admin
  </button>

  <button
    *ngIf="isLogin && role === 'ADMIN' && isSmallScreen"
    mat-icon-button
    class="auth-link favorite-icon"
    routerLink="/admin/profile"
  >
    <mat-icon>person_outline</mat-icon>
  </button>

  <button
    *ngIf="isLogin && role === 'USER'"
    mat-button
    mat-icon-button
    class="auth-link"
    routerLink="/user-dashboard/profile"
  >
    {{ user!.username }}
  </button>

  <button
    *ngIf="isLogin && role === 'USER' && isSmallScreen"
    mat-icon-button
    class="auth-link favorite-icon"
    routerLink="/admin/profile"
  >
    <mat-icon>person</mat-icon>
  </button>

  <a
    *ngIf="isLogin && !isSmallScreen"
    (click)="logout()"
    mat-icon-button
    class="auth-link"
  >
    Cerrar sesión
  </a>

  <a
    *ngIf="isLogin && isSmallScreen"
    (click)="logout()"
    mat-icon-button
    class="auth-link favorite-icon"
  >
    <mat-icon>exit_to_app</mat-icon>
  </a>
</mat-toolbar>
