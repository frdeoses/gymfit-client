<h1 class="text-center" mat-dialog-title>
  Hola <span> {{ commentDto.username }}</span>
</h1>
<div mat-dialog-content>
  <p>Escribe que es lo que opinas sobre el evento...</p>
  <mat-form-field class="w100" appearance="fill">
    <mat-label>Comentario:</mat-label>
    <input required matInput [(ngModel)]="commentDto.comment" />
  </mat-form-field>
</div>
<div class="w100" mat-dialog-actions>
  <button color="accent" mat-button (click)="onNoClick()">Cancelar</button>

  <button
    class="ml90"
    color="primary"
    mat-button
    [mat-dialog-close]="commentDto"
    cdkFocusInitial
  >
    Añadir
  </button>
</div>
