<div class="bootstrap-wrapper">
  <div class="container">
    <div class="row mt20">
      <div class="col-md-6 offset-md-3">
        <mat-card>
          <div class="container text-center">
            <img
              src="../../../assets/image/contrasena.png"
              width="100"
              height="100"
            />
          </div>

          <h1 class="text-center">Inicio de sesión</h1>

          <form [formGroup]="myForm" (ngSubmit)="formSubmit()">
            <mat-form-field class="full-width" appearance="outline">
              <mat-label> Usuario </mat-label>
              <input
                required
                matInput
                formControlName="username"
                name="username"
                placeholder="Introduzca el nombre del usuario..."
              />
              <mat-error *ngIf="isValidField('username')">
                {{ getFieldError("username") }}
              </mat-error>
            </mat-form-field>

            <mat-form-field class="full-width mt10" appearance="outline">
              <mat-label>Contraseña</mat-label>
              <input
                required
                matInput
                formControlName="password"
                name="password"
                type="password"
                placeholder="Introduzca la contraseña..."
              />
              <mat-error *ngIf="isValidField('password')">
                {{ getFieldError("password") }}
              </mat-error>
            </mat-form-field>

            <br />
            <br />
            <br />
            <div class="container text-center">
              <button
                mat-raised-button
                color="primary"
                [disabled]="!myForm.valid"
              >
                Iniciar sesión
              </button>
              <button
                type="reset"
                style="margin-left: 20px"
                mat-raised-button
                color="accent"
              >
                Limpiar
              </button>
            </div>
          </form>
        </mat-card>
      </div>
    </div>
  </div>
</div>
